// ---------- assets ----------
const img = new Image();

function buildTable() {

  const tones = ['#7a4f31', '#86593a', '#734a2d', '#80553600'];
  for (let i = 0; i < 4; i++) {
    const y0 = planks[i], y1 = planks[i + 1];
    const gr = g.createLinearGradient(0, y0, 0, y1);
    const base = ['#7b5034', '#865b3c', '#74492e', '#815638'][i];
    gr.addColorStop(0, base); gr.addColorStop(.5, ['#845a3b', '#8f6444', '#7c5135', '#8a5f40'][i]); gr.addColorStop(1, base);
    g.fillStyle = gr; g.fillRect(0, y0, W, y1 - y0);

      g.strokeStyle = `rgba(${r() < .5 ? '40,22,10' : '160,110,70'},${0.06 + r() * 0.12})`;
      g.lineWidth = 0.6 + r() * 2;

        const y = yy + Math.sin(x * f + ph) * amp + Math.sin(x * f * 3.1 + ph * 2) * amp * .3;
        x ? g.lineTo(x, y) : g.moveTo(x, y);

// crayons lying on the table
const CRAYONS = [

  { x: 385, y: 845, a: 0.5, c: '#3d78c2' }, { x: 470, y: 880, a: -0.35, c: '#e98fa8' },

const drawn = new Map();

// ---------- frame ----------
let lastT = -1;
function render(t) {
  if (t < lastT) resetReveal();
  lastT = t;
  advance(t);
  const st = stateAt(t);

  ctx.drawImage(tableCv, 0, 0);

  // compose paper
  const w = work.getContext('2d'), a = tmpA.getContext('2d');
  w.globalCompositeOperation = 'source-over';
  w.fillStyle = '#fbf8f1'; w.fillRect(0, 0, PW, PH);

  a.drawImage(sketchCv, 0, 0); a.globalCompositeOperation = 'destination-in'; a.drawImage(sketchMask, 0, 0);
  w.drawImage(tmpA, 0, 0);

  a.drawImage(colorCv, 0, 0); a.globalCompositeOperation = 'destination-in'; a.drawImage(colorMask, 0, 0);

  ctx.shadowColor = 'rgba(20,8,0,.5)'; ctx.shadowBlur = 30; ctx.shadowOffsetX = 8; ctx.shadowOffsetY = 14;
  ctx.fillStyle = '#fbf8f1'; ctx.fillRect(-PW / 2, -PH / 2, PW, PH);
  ctx.shadowColor = 'transparent';
  ctx.drawImage(work, -PW / 2, -PH / 2);

  for (const c of CRAYONS) {
    if (c.pick && pickedUp) continue;
    shadowed(() => crayon(c.x, c.y, c.a + Math.PI, 150, c.c), 0);
  }
  if (pencilDown) shadowed(() => pencil(PENCIL_SPOT.x, PENCIL_SPOT.y, Math.atan2(-TOOL.y, -TOOL.x), 230), 0);
  if (putDown) shadowed(() => crayon(CRAYON_DROP.x, CRAYON_DROP.y, Math.atan2(-TOOL.y, -TOOL.x), 150, '#8a5a33'), 0);

  const elbow = ik(wrist);
  const toolAng = Math.atan2(-TOOL.y, -TOOL.x);
  const holding = t < EV.dropPencil ? 'pencil' : (t >= EV.pickCrayon && t < EV.dropCrayon ? 'crayon' : null);
  const liftScale = 1 + lift * 0.025;

  // base
  shadowed(() => {
    ctx.save(); ctx.translate(BASE.x, BASE.y);
    ctx.fillStyle = '#3a3f47'; ctx.beginPath(); ctx.roundRect(-110, -130, 300, 260, 34); ctx.fill();
    ctx.fillStyle = '#4a505a'; ctx.beginPath(); ctx.roundRect(-100, -120, 280, 240, 28); ctx.fill();
    // little panel
    ctx.fillStyle = '#23262b'; ctx.beginPath(); ctx.roundRect(80, -70, 80, 140, 10); ctx.fill();
    const blink = (Math.floor(t * 2) % 2) ? '#7cff9a' : '#2f8a45';
    ctx.fillStyle = blink; ctx.beginPath(); ctx.arc(120, -40, 9, 0, 7); ctx.fill();
    ctx.fillStyle = st.drawing ? '#ffb347' : '#5a4630'; ctx.beginPath(); ctx.arc(120, -8, 9, 0, 7); ctx.fill();
    ctx.fillStyle = '#c94a3a'; ctx.beginPath(); ctx.arc(120, 38, 16, 0, 7); ctx.fill();
    ctx.fillStyle = '#e46a58'; ctx.beginPath(); ctx.arc(116, 34, 7, 0, 7); ctx.fill();

    const g = ctx.createRadialGradient(-10, -10, 10, 0, 0, 92);
    g.addColorStop(0, '#7b828e'); g.addColorStop(1, '#2d3137');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 92, 0, 7); ctx.fill();
    ctx.restore();

  ctx.save();

});
if (!location.hash.includes('capture')) {
  let start = null;
  window.__ready.then(() => {
    const loop = now => {
      if (start === null) start = now;
      let t = (now - start) / 1000;
      if (t > DURATION) { start = now; t = 0; }
      render(t); requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  });
  document.getElementById('again').onclick = () => { start = null; };
} else {
  document.body.classList.add('capture');
}
window.__render = render;
</script>
</body>
</html>
